<div class="max-w-7xl mx-auto py-6 sm:py-10 px-4 sm:px-6 lg:px-8">
  
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
    <h2 class="text-xl sm:text-2xl font-semibold text-[#0077b6]">Scheduled Interviews</h2>
    
    <div class="flex flex-wrap gap-2 bg-gray-100/80 p-1 rounded-lg w-full md:w-auto">
      <button 
        (click)="currentFilter = 'All'"
        [ngClass]="{'bg-white shadow-sm text-[#0077b6] ring-1 ring-gray-200': currentFilter === 'All', 'text-gray-500 hover:text-gray-700 hover:bg-gray-200/50': currentFilter !== 'All'}"
        class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-center">All</button>
      <button 
        (click)="currentFilter = 'Pending'"
        [ngClass]="{'bg-white shadow-sm text-[#0077b6] ring-1 ring-gray-200': currentFilter === 'Pending', 'text-gray-500 hover:text-gray-700 hover:bg-gray-200/50': currentFilter !== 'Pending'}"
        class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-center">Pending</button>
      <button 
        (click)="currentFilter = 'Completed'"
        [ngClass]="{'bg-white shadow-sm text-[#0077b6] ring-1 ring-gray-200': currentFilter === 'Completed', 'text-gray-500 hover:text-gray-700 hover:bg-gray-200/50': currentFilter !== 'Completed'}"
        class="flex-1 md:flex-none px-4 py-2 rounded-md text-sm font-medium transition-all text-center">Completed</button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-4 sm:px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap">Candidate</th>
            <th scope="col" class="px-4 sm:px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap">Interviewer</th>
            <th scope="col" class="px-4 sm:px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap">Date & Time</th>
            <th scope="col" class="px-4 sm:px-6 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider whitespace-nowrap">Status</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">Alex Johnson</div>
              <div class="text-sm text-gray-500">alex.j&#64;example.com</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">Sarah Smith</div>
              <div class="text-sm text-gray-500">Tech Lead</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">Oct 24, 2026</div>
              <div class="text-sm text-gray-500">10:00 AM</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800 border border-yellow-200">
                Pending
              </span>
            </td>
          </tr>
          <tr class="hover:bg-gray-50/50 transition-colors">
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900">Michael Chen</div>
              <div class="text-sm text-gray-500">m.chen&#64;example.com</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">David Ross</div>
              <div class="text-sm text-gray-500">HR Manager</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900">Oct 22, 2026</div>
              <div class="text-sm text-gray-500">02:00 PM</div>
            </td>
            <td class="px-4 sm:px-6 py-4 whitespace-nowrap">
              <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800 border border-green-200">
                Completed
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
