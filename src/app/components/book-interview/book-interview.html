<div class="max-w-3xl mx-auto py-6 sm:py-10 px-4 sm:px-6">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
    <div class="mb-8">
      <h2 class="text-xl sm:text-2xl font-semibold text-[#0077b6] mb-1">Book Your Interview</h2>
      <p class="text-gray-500 text-sm">Please fill in your details and select a preferred time slot.</p>
    </div>
    
    <form class="space-y-6 sm:space-y-8">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
          <input type="text" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white outline-none transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Contact Number</label>
          <input type="tel" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white outline-none transition-colors">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
          <input type="email" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white outline-none transition-colors">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Upload CV</label>
        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-xl hover:border-[#0077b6]/50 hover:bg-[#0077b6]/5 transition-colors bg-gray-50">
          <div class="space-y-2 text-center">
            <svg class="mx-auto h-10 w-10 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
              <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="flex flex-col sm:flex-row text-sm text-gray-600 justify-center items-center gap-1">
              <label for="file-upload" class="relative cursor-pointer rounded-md font-medium text-[#0077b6] hover:text-[#005f8d] focus-within:outline-none">
                <span>Upload a file</span>
                <input id="file-upload" name="file-upload" type="file" class="sr-only">
              </label>
              <p>or drag and drop</p>
            </div>
            <p class="text-xs text-gray-500">PDF, DOCX up to 10MB</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
         <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Date</label>
          <input type="date" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:bg-white outline-none">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Select Time</label>
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
          <button type="button"
            *ngFor="let slot of ['09:00 AM', '10:00 AM', '11:00 AM']"
            (click)="selectedSlot = slot"
            [ngClass]="{'bg-[#0077b6] text-white border-[#0077b6] ring-2 ring-[#0077b6]/30': selectedSlot === slot, 'bg-white text-gray-700 border-gray-200 hover:border-[#0077b6]/50 hover:bg-[#0077b6]/10': selectedSlot !== slot}"
            class="py-2.5 px-4 border rounded-lg text-sm font-medium transition-all duration-200">
            {{ slot }}
          </button>
        </div>
      </div>

      <div class="pt-6 border-t border-gray-100">
        <button type="submit" class="w-full px-6 py-3.5 bg-[#0077b6] hover:bg-[#005f8d] text-white font-medium rounded-lg transition-colors shadow-md focus:ring-4 focus:ring-[#0077b6]/30 text-lg sm:text-base">
          Confirm Booking
        </button>
      </div>
    </form>
  </div>
</div>
