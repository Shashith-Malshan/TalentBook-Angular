<div class="relative bg-slate-950/80 backdrop-blur-xl border-b border-white/10 shadow-2xl py-3 overflow-hidden">
  <div class="absolute top-0 left-1/4 w-1/2 h-full bg-gradient-to-r from-blue-500/20 via-cyan-400/20 to-emerald-500/20 blur-3xl pointer-events-none"></div>
  
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center z-10">
    
    <div class="flex items-center gap-3 text-slate-300 group cursor-default">
      
      <span class="text-xs sm:text-sm font-medium tracking-wide drop-shadow-sm">
        {{ currentTime | date:'EEEE, MMMM d, y' }}
      </span>
    </div>
    
    <div class="flex items-center gap-2.5 bg-slate-900/80 px-4 py-2 rounded-full border border-white/10 shadow-[inset_0_1px_2px_rgba(255,255,255,0.05),0_4px_12px_rgba(0,0,0,0.5)] backdrop-blur-md">
      
      <span class="text-xs sm:text-sm font-bold tracking-widest font-mono bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-400">
        {{ currentTime | date:'hh:mma' }}
      </span>
    </div>

  </div>
</div>
