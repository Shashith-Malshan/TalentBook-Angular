<div class="max-w-3xl mx-auto py-6 sm:py-10 px-4 sm:px-6">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
    <h2 class="text-xl sm:text-2xl font-semibold text-[#0077b6] mb-6">Create Interview Schedule</h2>
    
    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Interviewer Name</label>
          <input type="text" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white transition-all outline-none" placeholder="e.g. John Doe">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Designation</label>
          <input type="text" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white transition-all outline-none" placeholder="e.g. Senior Engineer">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Select Date</label>
        <input type="date" class="w-full md:w-1/2 px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#0077b6] focus:border-[#0077b6] focus:bg-white outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Available Time Slots</label>
        
          <app-timeslots-holder></app-timeslots-holder>
      </div>

      <div class="pt-4 mt-2 border-t border-gray-50">
        <button type="submit" class="w-full sm:w-auto px-6 py-3 bg-[#0077b6] hover:bg-[#005f8d] text-white font-medium rounded-lg transition-colors shadow-sm focus:ring-4 focus:ring-[#0077b6]/30">
          Publish Schedule
        </button>
      </div>
    </form>
  </div>
</div>
